  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #0d0d1a;
      font-family: Georgia, serif;
    }

    #splash {
      position: fixed;
      inset: 0;
      background: #0d0d1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }

    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .splash-letter {
      color: #D4AF37;
      font-size: 72px;
      font-weight: 300;
      letter-spacing: 4px;
      animation: fadeIn 0.8s ease forwards;
    }

    .splash-name {
      color: #ffffff;
      font-size: 13px;
      letter-spacing: 8px;
      margin-top: 16px;
      opacity: 0;
      animation: fadeIn 0.8s ease 0.3s forwards;
      text-transform: uppercase;
    }

    .splash-line {
      width: 0;
      height: 1px;
      background: #D4AF37;
      margin-top: 24px;
      animation: expandLine 0.8s ease 0.6s forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes expandLine {
      from { width: 0; }
      to   { width: 40px; }
    }
  </style>
</head>
<body>
  <!-- Accessible no-script fallback -->
  <noscript>
    <style>
      .noscript {
        background: #0d0d1a; color: #fff; font-family: Georgia, serif;
        display: flex; align-items: center; justify-content: center;
        height: 100vh; text-align: center; padding: 24px;
      }
    </style>
    <div class="noscript">
      <div>
        <h1 style="color:#D4AF37;letter-spacing:4px;font-weight:300;">SIENIAWSKI</h1>
        <p style="margin-top:16px;color:#ffffff99;">Please enable JavaScript to view this site.</p>
      </div>
    </div>
  </noscript>

  <div id="splash" role="status" aria-label="Loading Sieniawski">
    <div class="splash-letter" aria-hidden="true">S</div>
    <div class="splash-name" aria-hidden="true">Sieniawski</div>
    <div class="splash-line" aria-hidden="true"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('splash');
      splash.classList.add('hidden');
      setTimeout(function() { splash.remove(); }, 600);
    });
  </script>
</body>
</html>
